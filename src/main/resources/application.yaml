spring:
  application:
    name: TP2

  datasource:
    url: jdbc:mysql://localhost:3306/banco_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Jujuy
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true